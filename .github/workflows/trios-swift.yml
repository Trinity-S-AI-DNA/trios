name: Trios Swift CI

# Compile-and-test toolchain for the macOS `trios` app sources, now living in
# `apps/trios-macos/` after the Волна 5 consolidation (migrated out of the
# browseros repo). Runs on an Apple runner because the sources use
# SwiftUI/AppKit. The app keeps its macOS 14 deployment target
# (Package.swift `.macOS(.v14)`); the runner image is macos-15 because macos-14
# is being deprecated (2026), and a newer runner still builds for an older
# deployment target.
#
# It is compile/test-only: no GUI is launched, no code signing is performed,
# and no artifacts are published. The full `trios-app build` (Rust xtask) is
# intentionally NOT run here because it depends on the private Trinity Queen
# SwiftPM package (gHashTag/trinity) and ad-hoc signing of a .app bundle — see
# the final step.

on:
  push:
    branches: [main]
    paths:
      - apps/trios-macos/**
      - .github/workflows/trios-swift.yml
  pull_request:
    branches: [main]
    paths:
      - apps/trios-macos/**
      - .github/workflows/trios-swift.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trios-swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Compile and test (macos-15 runner)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log toolchain versions
        run: |
          echo "--- swift ---"
          swift --version
          echo "--- xcodebuild ---"
          xcodebuild -version
          echo "--- macOS SDK ---"
          xcrun --sdk macosx --show-sdk-version
          echo "--- active developer dir ---"
          xcode-select -p

      # MemoryStore encrypts the agent database with SQLCipher. The runner image
      # has sqlite3 but not sqlcipher, and sqlite3 has no `sqlite3_key`, so
      # without this every file importing CSQLCipher fails to compile.
      - name: Install SQLCipher
        run: brew install sqlcipher

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: apps/trios-macos/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('apps/trios-macos/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Focused standalone test — TodoListProjection
        working-directory: apps/trios-macos
        run: |
          swiftc tests/swift/todo_list_projection_test.swift \
            rings/SR-00/TodoListProjection.swift \
            rings/SR-00/ChatMessage.swift \
            rings/SR-01/A2AMessage.swift \
            rings/SR-00/AgentIdentity.swift \
            -o "$RUNNER_TEMP/todo_list_projection_test"
          "$RUNNER_TEMP/todo_list_projection_test"

      - name: Focused standalone test — TodoPanelPolicy
        working-directory: apps/trios-macos
        run: |
          swiftc tests/swift/todo_panel_policy_test.swift \
            rings/SR-00/TodoPanelPolicy.swift \
            rings/SR-00/ChatWorkspaceLayout.swift \
            -o "$RUNNER_TEMP/todo_panel_policy_test"
          "$RUNNER_TEMP/todo_panel_policy_test"

      - name: Existing focused test — ChatWorkspaceLayout
        working-directory: apps/trios-macos
        run: |
          swiftc tests/swift/chat_workspace_layout_test.swift \
            rings/SR-00/ChatWorkspaceLayout.swift \
            -o "$RUNNER_TEMP/chat_workspace_layout_test"
          "$RUNNER_TEMP/chat_workspace_layout_test"

      - name: Existing focused test — ChatLogic
        working-directory: apps/trios-macos
        run: |
          swiftc tests/swift/chat_logic_test.swift \
            BR-OUTPUT/ChatLogic.swift \
            -o "$RUNNER_TEMP/chat_logic_test"
          "$RUNNER_TEMP/chat_logic_test"

      # .trinity/specs/provider-endpoint-policy.md (#2051): Z.AI Coding Plan
      # routes refused, NVIDIA wire mapping, completion classifier, error codes.
      - name: Focused standalone test — ProviderEndpointPolicy
        working-directory: apps/trios-macos
        run: |
          swiftc tests/swift/provider_endpoint_policy_test.swift \
            rings/SR-00/ModelProvider.swift \
            rings/SR-00/ProviderEndpointPolicy.swift \
            rings/SR-00/ZAIErrorParser.swift \
            rings/SR-00/ModelKeyRotation.swift \
            rings/SR-00/ModelCatalogService.swift \
            -o "$RUNNER_TEMP/provider_endpoint_policy_test"
          "$RUNNER_TEMP/provider_endpoint_policy_test"
          swiftc tests/swift/zai_error_parser_test.swift \
            rings/SR-00/ZAIErrorParser.swift \
            -o "$RUNNER_TEMP/zai_error_parser_test"
          "$RUNNER_TEMP/zai_error_parser_test"

      # CI-safe project check: compiles the TriOSKit library (which includes the
      # rings/SR-00..SR-02 sources) and runs the XCTest suite. No GUI, no signing.
      - name: SwiftPM compile (TriOSKit)
        working-directory: apps/trios-macos
        run: swift build -c debug

      # TRIOS_VARIANT=dev routes secrets through DevSecretStore (files) instead
      # of the Keychain. Without it the suite does not fail - it hangs, because
      # SecItemCopyMatching puts up a password dialog that no one on a runner
      # can answer, and the job dies on its timeout having reported nothing.
      - name: SwiftPM test (TriOSKitTests)
        working-directory: apps/trios-macos
        env:
          TRIOS_VARIANT: dev
        run: swift test -c debug

      - name: Note — full app build is out of scope for CI
        if: always()
        run: |
          echo "trios-app build (Rust xtask) is not run in CI: it requires the private"
          echo "Trinity Queen SwiftPM package (TRINITY_ROOT/apps/queen) and ad-hoc"
          echo "codesign of a .app bundle. CI covers the source compile + tests"
          echo "that do not need those local/private dependencies."
