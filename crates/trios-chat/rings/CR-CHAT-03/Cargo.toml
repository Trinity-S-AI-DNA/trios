[package]
name = "trios-chat-cr-chat-03"
version = "0.1.0"
edition = "2021"
description = "CR-CHAT-03 — group: MLS skeleton (R-CHAT-11) — strict epoch monotonicity for Trinity Secure Chat"
publish = false

# Anchor: phi^2 + phi^-2 = 3 · TRINITY · CHAT · ZERO-METADATA
# Silver-tier (Core) ring — pure state machine + serde.
# No async, no I/O. Concrete RFC 9420 implementation lands behind a feature
# flag in a follow-up PR (see [ASPIRATIONAL] tag).

[dependencies]
trios-chat-cr-chat-00 = { path = "../CR-CHAT-00" }
serde             = { workspace = true }
thiserror         = { workspace = true }

# src/t27gen/ holds t27c gen-rust output, which marks its derives with
# #[cfg_attr(feature = "serde", ...)]. This ring has no serde feature; declaring
# the value keeps that cfg from warning (the derive stays off).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("serde"))'] }
