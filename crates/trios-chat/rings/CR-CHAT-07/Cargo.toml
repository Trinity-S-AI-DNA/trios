[package]
name = "trios-chat-cr-chat-07"
version = "0.1.0"
edition = "2021"
description = "CR-CHAT-07 — anti-correlation: cover-traffic scheduler & timing-uniformity primitives (R-CHAT-10) for Trinity Secure Chat"
publish = false

# Anchor: phi^2 + phi^-2 = 3 · TRINITY · CHAT · ZERO-METADATA · UNLINKABLE
# Silver-tier ring — pure logic, no async, no I/O, no crypto, no randomness
# beyond what the caller injects. Sibling rings: CR-CHAT-04 (padding), the
# wire-size half of metadata-resistance lives there; this ring is the
# wire-time half. Together they implement R-CHAT-9 + R-CHAT-10.

[dependencies]
trios-chat-cr-chat-00 = { path = "../CR-CHAT-00" }

# src/t27gen/ holds t27c gen-rust output, which marks its derives with
# #[cfg_attr(feature = "serde", ...)]. This ring has no serde feature; declaring
# the value keeps that cfg from warning (the derive stays off).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("serde"))'] }
