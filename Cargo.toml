[workspace]
members = [
    "crates/trios-core",
    "crates/trios-precision-router",
    "crates/trios-golden-float",
    "crates/trios-ternary",
    "crates/trios-tri",
    "crates/trios-hybrid",
    "crates/trios-train-cpu",
    "crates/trios-trainer",
    "crates/trios-git",
    "crates/trios-server",
    "crates/trios-gb",
    "crates/trios-agents",
    "crates/trios-bridge",
    "crates/trios-trinity-brain",
    "crates/trios-zig-agents",
    "crates/trios-hdc",
    "crates/trios-physics",
    "crates/trios-sacred",
    "crates/trios-crypto",
    "crates/trios-data",
    "crates/trios-vm",
    "crates/trios-vsa",
    "crates/trios-model",
    "crates/trios-llm",
    "crates/trios-sdk",
    "crates/trios-phi-schedule",
    "crates/trios-trinity-init",
    "crates/trios-fpga",
    "crates/trios-doctor",
    # trios-ext — Ring Architecture (issue #247)
    "crates/trios-ext/rings/SILVER-RING-EXT-00",
    "crates/trios-ext/rings/SILVER-RING-EXT-01",
    "crates/trios-ext/rings/SILVER-RING-EXT-02",
    "crates/trios-ext/rings/SILVER-RING-EXT-03",
    "crates/trios-ext/rings/BRONZE-RING-EXT/xtask",
    # trios-ui — excluded from workspace (Dioxus sidebar)
    "crates/trios-igla-race",
    "crates/trios-cli",
    "crates/trios-claude",
    "crates/trios-coq-witness",
    "contrib/anti-ban",
    "contrib/oracle",
    "crates/trios-server/xtask",
    # Rust-порт shell-скриптов приложения (L1) — Волна 10
    "apps/trios-macos/xtask",
    "crates/trios-ipc", "crates/tri-tunnel", "crates/tri-cli",
    # L13 — Rainbow Bridge (INV-8 online sync, ONE SHOT trios#267)
    "crates/trios-rainbow-bridge",
    # Coq proof extractor (L-R1: RUST ONLY)
    "crates/trinity-extract",
    # PhD monograph build / audit / bibliography / coq-map / reproduce (Rust-only, R1)
    "crates/trios-phd",
    # LT Phase D — page-count gate witness for trios#265 (Rust-only, R1)
    "tools/page_gate",
    "tools/acm_ae_check",
    "tools/citetheorem_audit",
    "tools/merge_order_gate",
    "tools/defense_gate",
    # trios-chat — Ring Architecture (Wave-38, issue #954)
    "crates/trios-chat/rings/CR-CHAT-00",
    "crates/trios-chat/rings/CR-CHAT-01",
    "crates/trios-chat/rings/CR-CHAT-02",
    "crates/trios-chat/rings/CR-CHAT-03",
    "crates/trios-chat/rings/CR-CHAT-04",
    "crates/trios-chat/rings/CR-CHAT-05",
    "crates/trios-chat/rings/CR-CHAT-06",
    "crates/trios-chat/rings/CR-CHAT-07",
    "crates/trios-chat/rings/CR-CHAT-LAWS",
    "crates/trios-chat/rings/BR-OUTPUT-CHAT",
    "crates/trios-chat/rings/BR-IO-CHAT-05",
    "crates/trios-chat/rings/BR-IO-CHAT-07",
    "crates/trios-chat",
    # Rust backend consolidation (Wave 0) — domain scaffolds
    "crates/trios-agent-loop",
    "crates/trios-agent-loop/rings/AL-00",
    "crates/trios-agent-loop/rings/AL-01",
    "crates/trios-agent-loop/rings/AL-02",
    "crates/trios-host-cdp",
    "crates/trios-host-cdp/rings/HC-00",
    "crates/trios-host-cdp/rings/HC-01",
    "crates/trios-host-cdp/rings/HC-02",
    "crates/trios-agent-harness",
    "crates/trios-agent-harness/rings/AH-00",
    "crates/trios-agent-harness/rings/AH-01",
    "crates/trios-agent-harness/rings/AH-02",
    "crates/trios-agent-harness/rings/AH-03",
    "crates/trios-openclaw",
    "crates/trios-openclaw/rings/OC-00",
    "crates/trios-openclaw/rings/OC-01",
    "crates/trios-browser",
    "crates/trios-browser/rings/BW-00",
    "crates/trios-browser/rings/BW-01",
    "crates/trios-klavis",
    "crates/trios-klavis/rings/KL-00",
    "crates/trios-acl",
    "crates/trios-acl/rings/AC-00",
]
exclude = [
    "crates/trios-ext",
    "crates/trios-ui",
    "crates/trios-a2a",
    # trios-store is a nested workspace (like trios-a2a)
    "crates/trios-store",
]
resolver = "2"

[workspace.package]
# 6.x continues the repo's historical v5.x tag line (the pre-Rust era);
# the Rust consolidation ships as major 6. Tag == this version == /version.
version = "6.0.0"
edition = "2021"
authors = ["Dmitrii Vasilev"]
license = "MIT"
repository = "https://github.com/gHashTag/trios"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
git2 = "0.19"
async-trait = "0.1"
tempfile = "3"
thiserror = "1"
futures = "0.3"
lazy_static = "1.4"
libc = "0.2"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
dioxus = "0.5"
dioxus-signals = "0.5"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = "0.3"
js-sys = "0.3"
log = "0.4"
wasm-logger = "0.2"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
